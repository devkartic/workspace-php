name: ${COMPOSE_PROJECT_NAME:-php-workspace}

services:
  # Project-specific PHP-FPM services and Nginx source mounts are generated in
  # docker/generated/projects.compose.yml from projects/*/.env.example.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/base.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/generated:/etc/nginx/conf.d/generated:ro
    networks:
      - app_network

  mariadb:
    # A separate volume protects the old MySQL data and avoids mixing storage formats.
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  database-init:
    # Runs on demand from `make up` so newly registered projects receive their
    # database even when MariaDB's persistent volume already exists.
    image: mariadb:11.4
    profiles: ["init"]
    restart: "no"
    environment:
      MYSQL_PWD: ${MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - ./generated/databases.sql:/work/databases.sql:ro
    entrypoint: ["sh", "-ec", "mariadb -h mariadb -uroot < /work/databases.sql"]
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app_network

  redis:
    # Shared cache/queue endpoint. Applications use redis:6379 internally;
    # REDIS_PORT controls only the optional host-side port.
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mariadb_data:
