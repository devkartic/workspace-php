# Project server blocks are generated from projects/*/.env.
# Docker's DNS resolves each independent PHP container when a request arrives.
resolver 127.0.0.11 valid=10s ipv6=off;
# Match shared PHP upload defaults; adjust alongside PHP for larger requests.
client_max_body_size 128m;
include /etc/nginx/conf.d/generated/*.conf;

server {
    listen 80 default_server;
    server_name _;
    return 404;
}
