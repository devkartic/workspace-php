; Loaded last; keep production error details out of HTTP responses.
display_errors = Off
display_startup_errors = Off
expose_php = Off
error_reporting = E_ALL
log_errors = On
error_log = /var/log/project/php-error.log
memory_limit = 256M
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
